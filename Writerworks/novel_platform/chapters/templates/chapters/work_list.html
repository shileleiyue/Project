{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作家工厂</title>
    <link rel="stylesheet" href="{% static 'chapters/work_list.css' %}">
</head>
<body class="body">
    <div class="head">
        <p1>作家工厂</p1><br>
        <p2>开发时间2026年4月19日 开发人：韩磊</p2><br>
        <strong><a href="./new_work.html"><button type="submit">新建作品</button></a></strong>
    </div>
    <form method="post" action="">
        {% csrf_token %}
            <p>作品名称：<input type="text" name="title" placeholder="作品名称"></p><br><br>
            <p>简介：<textarea name="description" id="" placeholder="简介"></textarea></p><br><br>
            <button >新建作品</button>
    </form>
{% if works %}
    {% for work in works %}
        <div>
            <h3><a href="{% url 'work_detail' work.id %}">{{ work.title }}</a></h3>
            {% if work.cover_image %}
                <img src="{{ work.cover_image }}" alt="封面" style="max-width:100px;">
            {% else %}
                <p>[暂无封面]</p>
            {% endif %}
                <p>创建于：{{ work.created_at }}</p>
        </div>
    {% endfor %}
{% else %}
    <p>暂无作品，请新建。</p>
    <button>新建</button>
{% endif %}
    
</body>
</html>
