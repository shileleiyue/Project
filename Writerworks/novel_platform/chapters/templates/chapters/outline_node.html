{% load static %}
<li class="outline-node" data-node-id="{{ node.id }}" data-rename-url="{% url 'outline_rename' work.id node.id %}">
    <div class="node-header">
        <div class="node-title-display">
            <strong class="node-title">{{ node.title }}</strong>
        </div>
        <div class="node-title-edit" style="display: none;">
            <input type="text" class="node-title-input" value="{{ node.title }}">
            <button class="save-node-rename-btn btn-sm">确认</button>
            <button class="cancel-node-rename-btn btn-sm">取消</button>
        </div>
        <div class="node-actions">
            <button class="rename-node-btn btn-sm">改名</button>
            <button class="toggle-child-form btn-sm">＋ 子节点</button>
            <form method="post" action="{% url 'outline_delete' work.id node.id %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn-delete btn-sm" onclick="return confirm('删除该节点会将其子节点提升到上一级，确定删除吗？');">删除</button>
            </form>
        </div>
    </div>
    <form class="child-form" style="display: none;" method="post" action="{% url 'outline_add_child' work.id node.id %}">
        {% csrf_token %}
        <input type="text" name="title" placeholder="子节点标题" required>
        <button type="submit" class="btn-sm">添加</button>
    </form>
    {% if node.children.exists %}
        <ul>
            {% for child in node.children.all %}
                {% include 'chapters/outline_node.html' with node=child %}
            {% endfor %}
        </ul>
    {% endif %}
</li>
