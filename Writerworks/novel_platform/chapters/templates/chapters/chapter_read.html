{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第{{ chapter.order }}章  {{ chapter.title }}</title>
    <link rel="stylesheet" href="{% static 'chapters/chapter_read.css' %}">
</head>
<body>
    <div class="header">
        <a href="{% url 'work_detail' work.id %}" class="back-link">返回作品详情 -- {{ work.title }}</a>
    </div>
    <div class="chapter-container">
        <div id="reading-area">
            <h3>{{ chapter.title }} <button id="edit-btn">编辑</button></h3>
            <pre class="reading-content" id="reading-content"><br>{{ chapter.content }}</pre>
        </div>
        <div class="editing-area" id="editing-area" style="display: none;">
            <h3>{{ chapter.title }}</h3>
            <textarea id="content-editor">{{ chapter.content }}</textarea>
            <br>
            <button id="save-btn">手动保存</button>
            <button id="cancel-btn">取消</button>
            <span id="save-status"></span>
        </div>
    </div>

    <script>
        console.log('JS loaded');
        const SAVE_URL = "{% url 'chapter_save' work.id chapter.id %}";

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        const readingArea = document.getElementById('reading-area');
        const editingArea = document.getElementById('editing-area');
        const editBtn = document.getElementById('edit-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const saveBtn = document.getElementById('save-btn');
        const contentEditor = document.getElementById('content-editor');
        const readingContent = document.getElementById('reading-content');
        const saveStatus = document.getElementById('save-status');

        function showEditor() {
            readingArea.style.display = 'none';
            editingArea.style.display = 'block';
            contentEditor.value = readingContent.textContent === '暂无正文' ? '' : readingContent.textContent;
            saveStatus.textContent = '';
        }

        function showReader() {
            editingArea.style.display = 'none';
            readingArea.style.display = 'block';
            const newContent = contentEditor.value.trim();
            const htmlContent = (newContent || '暂无正文').replace(/ /g, '\u00A0');
            readingContent.innerHTML = htmlContent;
        }

        editBtn.addEventListener('click', showEditor);
        cancelBtn.addEventListener('click', showReader);

        async function saveContent() {
            const content = contentEditor.value;
            const formData = new URLSearchParams();
            formData.append('content', content);
            try {
                const response = await fetch(SAVE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': csrftoken,
                    },
                    body: formData.toString(),
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        saveStatus.textContent = '已保存';
                        const newContent = contentEditor.value.trim();
                        const htmlContent = (newContent || '暂无正文').replace(/ /g, '\u00A0');
                        readingContent.innerHTML = htmlContent;
                    } else {
                        saveStatus.textContent = '保存失败：' + (data.error || '未知错误');
                    }
                } else {
                    saveStatus.textContent = '请求失败，状态码：' + response.status;
                }
            } catch (error) {
                console.error('保存出错:', error);
                saveStatus.textContent = '网络错误，保存失败';
            }
        }

        saveBtn.addEventListener('click', saveContent);

        let autoSaveTimer = null;
        const AUTO_SAVE_DELAY = 1000;
        contentEditor.addEventListener('input', () => {
            saveStatus.textContent = '保存中...';
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                saveContent().then(() => {});
            }, AUTO_SAVE_DELAY);
        });

        saveBtn.addEventListener('click', () => {
            if (autoSaveTimer) {
                clearTimeout(autoSaveTimer);
                autoSaveTimer = null;
            }
        });
    </script>
</body>
</html>
