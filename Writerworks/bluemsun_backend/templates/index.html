<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝旭考核系统</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1a73e8;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            transition: 0.2s;
        }
        .card h2 {
            margin-top: 0;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input, button {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        input {
            width: 100%;
        }
        button {
            background: #1a73e8;
            color: white;
            cursor: pointer;
            border: none;
            margin-right: 8px;
            margin-top: 5px;
        }
        button:hover {
            background: #0c5bc2;
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status {
            font-weight: bold;
            margin-top: 10px;
        }
        .success {
            color: #0b5e2e;
        }
        .error {
            color: #c5221f;
        }
        hr {
            margin: 15px 0;
        }
        .flex-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        pre {
            background: #f1f1f1;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 蓝旭后端考核系统 | Django + MySQL</h1>
    <div class="grid">
        <!-- 第五题：登录卡片 -->
        <div class="card">
            <h2>🔐 用户登录 (第5题)</h2>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="admin" value="admin">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="admin" value="admin">
            </div>
            <button id="loginBtn">登录</button>
            <div id="loginResult" class="result"></div>
        </div>

        <!-- 第六题：书籍检索卡片 -->
        <div class="card">
            <h2>📖 检索书籍 (第6题)</h2>
            <div class="form-group">
                <label>书籍ID</label>
                <input type="number" id="bookId" placeholder="请输入书籍ID" value="1">
            </div>
            <button id="searchBookBtn">检索</button>
            <div id="bookResult" class="result"></div>
            <div class="status" id="loginStatus"></div>
        </div>

        <!-- 第一题：类和折扣演示 -->
        <div class="card">
            <h2>📘 第1题：Book & EBook 类</h2>
            <button id="demoBookBtn">运行演示</button>
            <div id="bookClassResult" class="result"></div>
        </div>

        <!-- 第二题：文件处理 -->
        <div class="card">
            <h2>📄 第2题：处理 students.txt</h2>
            <p style="font-size:13px; color:#666;">需要项目根目录下有 students.txt，格式：姓名,年龄,分数</p>
            <button id="processFileBtn">读取并生成 summary.txt</button>
            <div id="fileResult" class="result"></div>
        </div>

        <!-- 第四题：事务演示 -->
        <div class="card">
            <h2>🗄️ 第4题：MySQL事务操作</h2>
            <div class="flex-btns">
                <button id="transInsertBtn">模拟插入失败(回滚)</button>
                <button id="queryExpensiveBtn">查询价格>50商品</button>
                <button id="updateStockBtn">库存全部+10(事务)</button>
            </div>
            <div id="transactionResult" class="result"></div>
        </div>
    </div>
</div>

<script>
    // 获取DOM元素
    const loginBtn = document.getElementById('loginBtn');
    const searchBookBtn = document.getElementById('searchBookBtn');
    const demoBookBtn = document.getElementById('demoBookBtn');
    const processFileBtn = document.getElementById('processFileBtn');
    const transInsertBtn = document.getElementById('transInsertBtn');
    const queryExpensiveBtn = document.getElementById('queryExpensiveBtn');
    const updateStockBtn = document.getElementById('updateStockBtn');

    const loginResult = document.getElementById('loginResult');
    const bookResult = document.getElementById('bookResult');
    const loginStatus = document.getElementById('loginStatus');
    const bookClassResult = document.getElementById('bookClassResult');
    const fileResult = document.getElementById('fileResult');
    const transactionResult = document.getElementById('transactionResult');

    // 辅助请求函数
    async function apiRequest(url, method = 'GET', data = null) {
        const options = {
            method: method,
            headers: {
                'Content-Type': 'application/json',
            },
            credentials: 'same-origin',  // 携带session
        };
        if (data) {
            options.body = JSON.stringify(data);
        }
        const response = await fetch(url, options);
        return await response.json();
    }

    // 显示登录状态
    async function checkLoginStatus() {
        // 通过书籍检索测试（未登录会返回401）
        const res = await apiRequest('/book/search?id=1');
        if (res.code === 401) {
            loginStatus.innerHTML = '❌ 当前未登录，请先登录';
            loginStatus.className = 'status error';
        } else if (res.code === 0) {
            loginStatus.innerHTML = '✅ 已登录，可正常检索书籍';
            loginStatus.className = 'status success';
        } else {
            loginStatus.innerHTML = '⚠️ 请先登录';
            loginStatus.className = 'status error';
        }
    }

    // 登录
    loginBtn.onclick = async () => {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        if (!username || !password) {
            loginResult.innerHTML = '<span class="error">用户名和密码不能为空</span>';
            return;
        }
        const res = await apiRequest('/user/login', 'POST', { username, password });
        if (res.code === 200) {
            loginResult.innerHTML = '<span class="success">✅ 登录成功！已保持登录状态</span>';
            await checkLoginStatus();
        } else {
            loginResult.innerHTML = `<span class="error">❌ ${res.msg}</span>`;
        }
    };

    // 检索书籍（需要登录）
    searchBookBtn.onclick = async () => {
        const id = document.getElementById('bookId').value;
        if (!id) {
            bookResult.innerHTML = '<span class="error">请输入书籍ID</span>';
            return;
        }
        const res = await apiRequest(`/book/search?id=${id}`);
        if (res.code === 0) {
            bookResult.innerHTML = `<span class="success">✅ ${res.msg}</span><br>📚 书籍详情：ID=${res.data.id}, 名称=${res.data.name}, 作者=${res.data.author}`;
        } else {
            bookResult.innerHTML = `<span class="error">❌ ${res.msg}</span>`;
        }
    };

    // 第一题演示
    demoBookBtn.onclick = async () => {
        const res = await apiRequest('/demo/book_class');
        if (res.code === 0) {
            bookClassResult.innerHTML = `<strong>电子书信息：</strong> ${res.book_info}<br>
                                        <strong>原价：</strong> ¥${res.original_price}<br>
                                        <strong>20%折扣后价格：</strong> ¥${res.discounted_price.toFixed(2)}`;
        } else {
            bookClassResult.innerHTML = `<span class="error">演示失败</span>`;
        }
    };

    // 第二题：处理文件
    processFileBtn.onclick = async () => {
        fileResult.innerHTML = '处理中...';
        const res = await apiRequest('/demo/process_students', 'POST');
        if (res.code === 0) {
            fileResult.innerHTML = `<span class="success">✅ ${res.msg}</span><br>📊 平均分：${res.average_score} (共${res.student_count}人)<br>📁 已生成 summary.txt`;
        } else {
            fileResult.innerHTML = `<span class="error">❌ ${res.msg}</span>`;
        }
    };

    // 第四题 - 事务插入（模拟失败回滚）
    transInsertBtn.onclick = async () => {
        transactionResult.innerHTML = '执行事务插入...';
        const res = await apiRequest('/demo/transaction_insert', 'POST');
        transactionResult.innerHTML = res.code === 0 ? `<span class="success">✅ ${res.msg}</span>` : `<span class="error">⚠️ ${res.msg}</span>`;
    };

    // 查询价格>50的商品
    queryExpensiveBtn.onclick = async () => {
        const res = await apiRequest('/demo/expensive_products');
        if (res.code === 0 && res.products.length) {
            let html = `<strong>💰 价格大于50的商品 (${res.count}个):</strong><br>`;
            res.products.forEach(p => {
                html += `· ${p.name} | 价格: ¥${p.price} | 库存: ${p.stock}<br>`;
            });
            transactionResult.innerHTML = html;
        } else {
            transactionResult.innerHTML = `<span>暂无价格>50的商品</span>`;
        }
    };

    // 更新库存全部+10（事务）
    updateStockBtn.onclick = async () => {
        transactionResult.innerHTML = '更新库存中...';
        const res = await apiRequest('/demo/update_stock', 'POST');
        transactionResult.innerHTML = res.code === 0 ? `<span class="success">✅ ${res.msg}</span>` : `<span class="error">❌ ${res.msg}</span>`;
        // 自动刷新查询结果（可选）
        setTimeout(() => queryExpensiveBtn.click(), 500);
    };

    // 页面加载检查登录状态
    checkLoginStatus();
    // 启动后自动初始化一些演示数据（由后端init_test_data完成）
</script>
</body>
</html>
