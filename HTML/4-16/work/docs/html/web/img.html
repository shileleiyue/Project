<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>图片链接 - HTML课程</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>
    <body>
        <div class="container">
            <header>
                <h1>图片链接</h1>
                <p>学习图片标签的使用</p>
            </header>
            
            <nav>
                <ul>
                    <li><a href="../index.html">首页</a></li>
                    <li><a href="../other/als.html">爱莲说</a></li>
                    <li><a href="img.html">图片链接</a></li>
                    <li><a href="../other/form.html">个人表单</a></li>
                </ul>
            </nav>
            
            <main>
                <div class="breadcrumb">
                    <a href="../index.html">首页</a> &gt; 图片链接
                </div>
                
                <h2>图片展示</h2>
                <p>以下是不同类型的图片链接示例：</p>
                
                <div>
                    <h3>1. 可点击的图片链接</h3>
                    <a href="https://www.nenu.edu.cn/" target="_blank">
                        <img src="img/pic01.jpg" alt="示例图片">
                    </a>
                    <p>点击图片将跳转到 example.com</p>
                </div>
                
                <div style="margin-top: 30px;">
                    <h3>2. 本地图片</h3>
                    <img src="img/pic01.jpg" alt="本地示例图片">
                    <p>这是一张本地存储的图片</p>
                </div>
                
                <div style="margin-top: 30px;">
                    <h3>3. 网络图片</h3>
                    <img src="https://www.fjsmu.edu.cn/_upload/article/images/96/52/050ecfe9429eae81567c93a3b3f4/9a3c2d10-bfe8-4927-9808-b9edfa7e1044.jpg" alt="网络图片">
                    <p>这是一张通过URL引用的网络图片</p>
                </div>
            </main>
            
            <button class="back-btn" onclick="goBack()">返回首页</button>
        </div>
        
        <script>
            function goBack() {
                window.location.href = '../index.html';
            }
            
            // 导航栏active状态切换
            document.addEventListener('DOMContentLoaded', function() {
                const navLinks = document.querySelectorAll('nav a');
                const currentUrl = window.location.href;
                
                navLinks.forEach(link => {
                    if (link.href === currentUrl) {
                        link.classList.add('active');
                    }
                });
            });
        </script>
    </body>
</html>
