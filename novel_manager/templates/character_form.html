{% extends "base.html" %}
{% block content %}
<h2>{{ '编辑角色' if character else '添加角色' }}</h2>
<form method="post">
    <div class="mb-3">
        <label>姓名*</label>
        <input type="text" name="name" class="form-control" value="{{ character.name if character else '' }}" required>
    </div>
    <div class="mb-3">
        <label>别名</label>
        <input type="text" name="alias" class="form-control" value="{{ character.alias if character else '' }}">
    </div>
    <div class="mb-3">
        <label>性别</label>
        <select name="gender" class="form-select">
            <option value="">未指定</option>
            <option value="男" {% if character and character.gender=='男' %}selected{% endif %}>男</option>
            <option value="女" {% if character and character.gender=='女' %}selected{% endif %}>女</option>
        </select>
    </div>
    <div class="mb-3">
        <label>年龄</label>
        <input type="number" name="age" class="form-control" value="{{ character.age if character else '' }}">
    </div>
    <div class="mb-3">
        <label>简介</label>
        <textarea name="description" rows="3" class="form-control">{{ character.description if character else '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="{{ url_for('characters') }}" class="btn btn-secondary">取消</a>
</form>
{% endblock %}
