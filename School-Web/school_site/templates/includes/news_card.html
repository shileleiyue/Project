{% load static %}
<div class="card mb-3">
    <div class="row g-0">
        {% if article.cover_image %}
        <div class="col-md-4">
            <img src="{{ article.cover_image.image.url }}" class="img-fluid rounded-start" alt="{{ article.title }}" loading="lazy">
        </div>
        {% endif %}
        <div class="col">
            <div class="card-body">
                <h5 class="card-title">
                    {% if article.is_pinned %}<span class="badge bg-danger">置顶</span>{% endif %}
                    <a href="{% url 'news:article_detail' article.slug %}" class="text-decoration-none stretched-link">{{ article.title }}</a>
                </h5>
                <p class="text-muted small">{{ article.pub_date|date:"Y-m-d H:i" }} · {{ article.category.name }}</p>
                <p class="card-text">{{ article.excerpt|truncatechars:150 }}</p>
            </div>
        </div>
    </div>
</div>
