<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-23-1</title>
    <style>
        h1{
            color: red;
            font-size: 30px;
            text-align: center;

            padding: 0px;

        span{
            height: 100px;
            display: inline-block;
            color: rgb(127, 214, 134);

        }
        a{
            height: 100px;
            color: rgb(127, 214, 134);
            background-color: #e64444;
            line-height: 50px;
        }
    </style>
</head>
<body>
    <h1>我是一个块级元素</h1>
