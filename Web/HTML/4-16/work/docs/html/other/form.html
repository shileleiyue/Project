<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>个人表单 - HTML课程</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>
    <body>
        <div class="container">
            <header>
                <h1>个人信息表单</h1>
                <p>请填写以下个人信息</p>
            </header>
            
            <nav>
                <ul>
                    <li><a href="../index.html">首页</a></li>
                    <li><a href="als.html">爱莲说</a></li>
                    <li><a href="../web/img.html">图片链接</a></li>
                    <li><a href="form.html">个人表单</a></li>
                </ul>
            </nav>
            
            <main>
                <div class="breadcrumb">
                    <a href="../index.html">首页</a> &gt; 个人表单
                </div>
                
                <form id="personalForm" onsubmit="return validateForm()">
                    <div class="form-group">
                        <label for="name">姓名 *</label>
                        <input type="text" id="name" name="name" placeholder="请输入姓名">
                        <span id="nameError" class="error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">邮箱 *</label>
                        <input type="email" id="email" name="email" placeholder="请输入邮箱">
                        <span id="emailError" class="error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">电话 *</label>
                        <input type="tel" id="phone" name="phone" placeholder="请输入手机号码">
                        <span id="phoneError" class="error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label>性别 *</label>
                        <div>
                            <input type="radio" id="male" name="gender" value="male">
                            <label for="male">男</label>
                            <input type="radio" id="female" name="gender" value="female">
                            <label for="female">女</label>
                        </div>
                        <span id="genderError" class="error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label>兴趣爱好</label>
                        <div>
                            <input type="checkbox" id="hobby1" name="hobby" value="reading">
                            <label for="hobby1">阅读</label>
                            <input type="checkbox" id="hobby2" name="hobby" value="sports">
                            <label for="hobby2">运动</label>
                            <input type="checkbox" id="hobby3" name="hobby" value="music">
                            <label for="hobby3">音乐</label>
                            <input type="checkbox" id="hobby4" name="hobby" value="travel">
                            <label for="hobby4">旅行</label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="education">学历</label>
                        <select id="education" name="education">
                            <option value="">请选择</option>
                            <option value="high school">高中</option>
                            <option value="college">大专</option>
                            <option value="bachelor">本科</option>
                            <option value="master">硕士</option>
                            <option value="phd">博士</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">个人简介</label>
                        <textarea id="message" name="message" rows="4" placeholder="请输入个人简介"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <input type="submit" value="提交">
                        <input type="reset" value="重置" style="margin-left: 10px; background-color: #95a5a6;">
                    </div>
                </form>
            </main>
            
            <button class="back-btn" onclick="goBack()">返回首页</button>
        </div>
        
        <script>
            function validateForm() {
                let isValid = true;
                
                // 清除之前的错误信息
                document.querySelectorAll('.error').forEach(function(element) {
                    element.textContent = '';
                });
                
                // 验证姓名
                const name = document.getElementById('name').value.trim();
                if (name === '') {
                    document.getElementById('nameError').textContent = '请输入姓名';
                    isValid = false;
                }
                
                // 验证邮箱
                const email = document.getElementById('email').value.trim();
                if (email === '') {
                    document.getElementById('emailError').textContent = '请输入邮箱';
                    isValid = false;
                } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    document.getElementById('emailError').textContent = '请输入有效的邮箱地址';
                    isValid = false;
                }
                
                // 验证电话
                const phone = document.getElementById('phone').value.trim();
                if (phone === '') {
                    document.getElementById('phoneError').textContent = '请输入电话';
                    isValid = false;
                } else if (!/^1[3-9]\d{9}$/.test(phone)) {
                    document.getElementById('phoneError').textContent = '请输入有效的手机号码';
                    isValid = false;
                }
                
                // 验证性别
                const gender = document.querySelector('input[name="gender"]:checked');
                if (!gender) {
                    document.getElementById('genderError').textContent = '请选择性别';
                    isValid = false;
                }
                
                if (isValid) {
                    alert('表单提交成功！');
                    return false; // 阻止表单实际提交，仅用于演示
                }
                
                return false;
            }
            
            function goBack() {
                window.location.href = '../index.html';
            }
            
            // 导航栏active状态切换
            document.addEventListener('DOMContentLoaded', function() {
                const navLinks = document.querySelectorAll('nav a');
                const currentUrl = window.location.href;
                
                navLinks.forEach(link => {
                    if (link.href === currentUrl) {
                        link.classList.add('active');
                    }
                });
            });
        </script>
    </body>
</html>
