{% extends "base.html" %}
{% load static %}

{% block title %}校长信箱 - {{ school_info.name }}{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/pages/inner.css' %}">{% endblock %}

{% block content %}
<div class="breadcrumb"><div class="container"><ol><li><a href="{% url 'core:home' %}">首页</a></li><li>校长信箱</li></ol></div></div>
<section class="container" data-animate="fade-up">
  <h1>校长信箱</h1>
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="form-group"><label class="form-label">姓名</label><input type="text" name="name" class="form-input" required></div>
        <div class="form-group"><label class="form-label">邮箱</label><input type="email" name="email" class="form-input" required></div>
        <div class="form-group"><label class="form-label">主题</label><input type="text" name="subject" class="form-input" required></div>
        <div class="form-group"><label class="form-label">内容</label><textarea name="message" class="form-textarea" required></textarea></div>
        <button type="submit" class="btn btn-primary">发送</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
