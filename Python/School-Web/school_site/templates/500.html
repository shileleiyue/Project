{% extends "base.html" %}
{% block title %}服务器错误 - {{ school_info.name }}{% endblock %}
{% block content %}
<section class="container" style="padding: var(--spacing-xl) 0; min-height: 60vh; display: flex; align-items: center; justify-content: center;">
  <div style="text-align: center; max-width: 560px;">
    <div style="font-size: 8rem; font-weight: 700; line-height: 1; color: var(--color-accent); opacity: 0.15; margin-bottom: calc(var(--spacing-lg) * -1);">500</div>
    <div style="font-size: 3rem; margin-bottom: var(--spacing-md);">⚙️</div>
    <h1 style="font-size: 1.75rem; color: var(--color-primary-dark); margin-bottom: var(--spacing-sm);">服务器内部错误</h1>
    <p style="font-size: 1.05rem; color: var(--color-text-light); line-height: 1.7; margin-bottom: var(--spacing-lg);">
      抱歉，服务器遇到了意外问题，暂时无法完成您的请求。<br>
      请稍后重试，或返回首页浏览其他内容。
    </p>
    <div style="display: flex; flex-wrap: wrap; gap: var(--spacing-sm); justify-content: center;">
      <a href="{% url 'core:home' %}" class="btn btn-primary" style="padding: 0.75rem 2rem; font-size: 1rem;">返回首页</a>
      <a href="javascript:history.back()" class="btn btn-outline" style="padding: 0.75rem 2rem; font-size: 1rem;">返回上一页</a>
    </div>
  </div>
</section>
{% endblock %}
