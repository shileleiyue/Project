<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 校园设备借用与维修管理系统</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1 class="login-title">校园设备借用与维修管理系统</h1>
    <p class="login-subtitle">欢迎回来，请登录您的账号</p>
    <form id="login-form">
      <div class="form-group">
        <label for="phone">手机号</label>
        <input type="text" id="phone" class="form-input" placeholder="请输入手机号" autocomplete="tel" maxlength="11">
        <span class="form-error" id="phone-error"></span>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password">
        <span class="form-error" id="password-error"></span>
      </div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn btn-primary" id="login-btn">登 录</button>
    </form>
    <p class="login-link">还没有账号？<a href="register.html">立即注册</a></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script>
    // 如果已登录，直接跳转到首页
    if (Storage.isLoggedIn()) {
      window.location.href = 'index.html';
    }

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value.trim();
      const loginBtn = document.getElementById('login-btn');
      const loginError = document.getElementById('login-error');
      const phoneError = document.getElementById('phone-error');
      const passwordError = document.getElementById('password-error');

      // 清除之前的错误
      phoneError.textContent = '';
      passwordError.textContent = '';
      loginError.textContent = '';

      // 校验
      let valid = true;
      if (!phone) {
        phoneError.textContent = '请输入手机号';
        valid = false;
      } else if (!/^1\d{10}$/.test(phone)) {
        phoneError.textContent = '请输入正确的手机号';
        valid = false;
      }
      if (!password) {
        passwordError.textContent = '请输入密码';
        valid = false;
      }
      if (!valid) return;

      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';

      try {
        await Auth.login(phone, password);
        Toast.show('登录成功', 'success');
        setTimeout(function() {
          window.location.href = 'index.html';
        }, 500);
      } catch (error) {
        loginError.textContent = error.message || '登录失败，请重试';
        Toast.show(error.message || '登录失败', 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
