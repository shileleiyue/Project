{% extends 'base.html' %}
{% block title %}{% if schedule %}编辑日程{% else %}新建日程{% endif %}{% endblock %}
{% block page_title %}{% if schedule %}编辑日程{% else %}新建日程{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>标题</label>
            <input type="text" name="title" value="{{ schedule.title|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>开始时间</label>
            <input type="datetime-local" name="start_time" value="{{ schedule.start_time|date:'Y-m-d\TH:i'|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>结束时间</label>
            <input type="datetime-local" name="end_time" value="{{ schedule.end_time|date:'Y-m-d\TH:i'|default:'' }}">
        </div>
        <div class="form-group">
            <label>地点</label>
            <input type="text" name="location" value="{{ schedule.location|default:'' }}">
        </div>
        <div class="form-group">
            <label>描述</label>
            <textarea name="description" rows="3">{{ schedule.description|default:'' }}</textarea>
        </div>
        {% if schedule %}
        <div class="form-group">
            <label>状态</label>
            <select name="status">
                <option value="pending" {% if schedule.status == 'pending' %}selected{% endif %}>待确认</option>
                <option value="confirmed" {% if schedule.status == 'confirmed' %}selected{% endif %}>已确认</option>
                <option value="completed" {% if schedule.status == 'completed' %}selected{% endif %}>已完成</option>
                <option value="cancelled" {% if schedule.status == 'cancelled' %}selected{% endif %}>已取消</option>
            </select>
        </div>
        {% endif %}
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{% url 'scheduler:schedule_list' %}" class="btn" style="background:#f0f0f0;color:#333;">取消</a>
    </form>
</div>
{% endblock %}
