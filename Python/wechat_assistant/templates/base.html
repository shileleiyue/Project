<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信助手 - {% block title %}首页{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }
        .layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 220px;
            background: #1a1a2e;
            color: #fff;
            padding: 20px 0;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar h2 {
            padding: 0 20px 20px;
            font-size: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 10px;
        }
        .sidebar nav a {
            display: block;
            padding: 12px 20px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 14px;
        }
        .sidebar nav a:hover, .sidebar nav a.active {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .main {
            margin-left: 220px;
            flex: 1;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8e8e8;
        }
        .header h1 { font-size: 22px; color: #1a1a2e; }
        .header .user-info { font-size: 14px; color: #666; }
        .header .user-info a {
            color: #1890ff;
            text-decoration: none;
            margin-left: 8px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 16px;
        }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .stat-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: center;
        }
        .stat-card .number { font-size: 32px; font-weight: 700; color: #1a1a2e; }
        .stat-card .label { font-size: 14px; color: #888; margin-top: 4px; }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-primary { background: #1890ff; color: #fff; }
        .btn-primary:hover { background: #40a9ff; }
        .btn-danger { background: #ff4d4f; color: #fff; }
        .btn-danger:hover { background: #ff7875; }
        .btn-sm { padding: 4px 8px; font-size: 12px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 14px; color: #555; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
        }
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table th, .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .table th { color: #888; font-weight: 500; }
        .table tr:hover { background: #fafafa; }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #fff;
        }
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
        }
        .search-bar input:focus { outline: none; border-color: #1890ff; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state p { font-size: 16px; margin-top: 8px; }
        .priority-high { color: #ff4d4f; }
        .priority-medium { color: #faad14; }
        .priority-low { color: #52c41a; }
        .starred { color: #faad14; }
        .msg-type-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            background: #f0f0f0;
            color: #666;
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filter-bar select, .filter-bar a {
            padding: 6px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
            background: #fff;
            text-decoration: none;
            color: #333;
        }
        .filter-bar a:hover { border-color: #1890ff; color: #1890ff; }
        .filter-bar a.active { background: #1890ff; color: #fff; border-color: #1890ff; }
        .pagination { display: flex; gap: 4px; justify-content: center; margin-top: 20px; }
        .pagination a { padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 4px; text-decoration: none; color: #333; }
        .pagination a:hover { border-color: #1890ff; color: #1890ff; }
        .alert { padding: 12px; border-radius: 4px; margin-bottom: 16px; font-size: 14px; }
        .alert-success { background: #f6ffed; border: 1px solid #b7eb8f; color: #52c41a; }
        .alert-error { background: #fff2f0; border: 1px solid #ffccc7; color: #ff4d4f; }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>微信助手</h2>
            <nav>
                <a href="{% url 'core:dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">概览</a>
                <a href="{% url 'core:conversation_list' %}" class="{% if request.resolver_match.url_name == 'conversation_list' %}active{% endif %}">会话</a>
                <a href="{% url 'core:message_list' %}" class="{% if request.resolver_match.url_name == 'message_list' %}active{% endif %}">消息</a>
                <a href="{% url 'core:contact_list' %}" class="{% if request.resolver_match.url_name == 'contact_list' %}active{% endif %}">联系人</a>
                <a href="{% url 'scheduler:schedule_list' %}" class="{% if request.resolver_match.url_name == 'schedule_list' %}active{% endif %}">日程</a>
                <a href="{% url 'scheduler:todo_list' %}" class="{% if request.resolver_match.url_name == 'todo_list' %}active{% endif %}">待办</a>
                <a href="{% url 'wechat_bridge:account_list' %}" class="{% if request.resolver_match.url_name == 'account_list' %}active{% endif %}">微信账户</a>
                <hr style="border-color: rgba(255,255,255,0.1); margin: 10px 20px;">
                <form method="post" action="{% url 'logout' %}" style="padding: 0 20px;">
                    {% csrf_token %}
                    <button type="submit" style="background:none;border:none;color:rgba(255,255,255,0.7);cursor:pointer;padding:12px 0;font-size:14px;width:100%;text-align:left;">退出登录</button>
                </form>
            </nav>
        </aside>
        <main class="main">
            <div class="header">
                <h1>{% block page_title %}首页{% endblock %}</h1>
                <div class="user-info">
                    {{ request.user.username }}
                    <form method="post" action="{% url 'logout' %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" style="background:none;border:none;color:#1890ff;cursor:pointer;font-size:14px;margin-left:8px;text-decoration:underline;">退出</button>
                    </form>
                </div>
            </div>
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
